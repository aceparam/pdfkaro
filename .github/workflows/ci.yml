name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets the preview workflow run these same checks before it publishes.
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      OPENSPEC_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Page weight
        run: npm run weigh
      - name: Engines stay out of the worker file
        run: npm run check:worker
      - name: Links work under a sub-path
        run: npm run check:base
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run e2e
      - name: OpenSpec changes and specs
        run: npm run spec
